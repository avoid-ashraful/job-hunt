- name: english-text-tagged-de-with-german-benefits-is-kept
  stage: role
  job:
    description: >-
      We are hiring a Senior Backend Engineer to help us scale our payments platform. You will
      build and maintain services in Python and Django, improve the reliability of our PostgreSQL
      and Redis setup, and work with the team on the roadmap for the next year. This is a remote
      role and we meet in person twice a year. You should be comfortable with code review,
      testing and on-call. Wir bieten ein Jobrad, betriebliche Altersvorsorge und 30 Tage Urlaub
      für alle Mitarbeitenden.
    posting_language: de
  expected:
    outcome: keep
