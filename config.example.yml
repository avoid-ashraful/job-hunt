# Example scanner config. Copy to private/config/config.yml and edit.
# Regexes are Python `re`, matched case-insensitively unless noted.

candidate:
  country: Bangladesh
  timezone: Asia/Dhaka
  # freehire region tags compatible with the candidate. A job whose text is silent about
  # location stays in Check with these tags (or none); otherwise it's a "long shot".
  tag_regions_ok: [global, apac]   # ...unless the source pins the job to other countries (apac + India)
  country_code: bd                 # ISO code matched against the source's country tags
  company_priors: vendor/remote-jobs/src/companies   # remoteintech: companies that hire worldwide
  resume: private/profile/resume.pdf

sources:
  hn:
    enabled: true                  # HN jobs index and current/previous Who-is-hiring threads
    jobs_page: true                # include YC-style HN jobs posts
    max_job_pages: 2              # bound index requests per run
    max_comment_pages: 15         # bound pages per monthly hiring thread
    request_delay_s: 1.0          # pause between Algolia API pages
    remote_pattern: '\bremote\b' # only explicitly remote posts
    worldwide_pattern: '\b(worldwide|anywhere in the world|remote globally|global remote)\b' # strong location label
    role_pattern: '\b(?:(?:senior|staff|lead|principal)\s+)?(?:python|django|backend|back-end|platform|software|fullstack|full-stack|api)\s+(?:engineer|developer)\b' # role extraction
  himalayas:
    enabled: true                  # public Himalayas worldwide job search
    base_url: https://himalayas.app/jobs/api/search # documented search endpoint
    queries: [python, django, backend] # API keyword searches
    max_pages_per_query: 3        # bound shared public API use
    request_delay_s: 1.0          # pause between API pages
    # api_key: ''                 # optional free key; higher rate allowance
  workable:
    enabled: true                  # public Workable cross-company remote search
    base_url: https://jobs.workable.com/api/v1/jobs # search endpoint
    queries: [python, django, backend] # API keyword searches
    max_pages_per_query: 3        # bound requests per query
    request_delay_s: 1.0          # pause between API pages
  freehire:
    enabled: true
    base_url: https://freehire.me/api/v1
    # freehire category facets used for recall; titles are filtered locally below.
    categories: [backend, fullstack, software_engineering, ai_engineering, ml_ai, architecture, devops, data_engineering, security]
    work_mode: remote
    seniority_exclude: [intern, junior]
    first_run_days: 21          # backfill window on an empty database
    daily_lookback_days: 3      # overlap on later runs; dedup removes repeats
    page_size: 100
    request_delay_s: 1.0

filters:
  max_age_days: 21              # age = earliest of posted date and first-seen date
  not_seen_live_days: 10        # not seen live by the source for this long: probably closed (freehire re-crawls ~weekly)

  # A title must match at least one family. Order matters: first match wins and is
  # the "role family" used when collapsing seniority within a company.
  role_families:
    python:     ['\bpython\b', '\bdjango\b', '\bfastapi\b']
    backend:    ['back[\s-]?end', '\bapi\b', 'platform engineer', 'server[\s-]?side']
    fullstack:  ['full[\s-]?stack']
    applied_ai: ['applied ai']
    software:   ['software (engineer|developer|development engineer)', '\bswe\b', '\bsde\b']
    generic:    ['^\W*((sr\.?|senior|staff|lead|principal)\s+)*(engineer|developer)\b']

  title_exclude:
    - 'front[\s-]?end'
    - '\b(ios|android|mobile)\b'
    - '\b(qa|sdet|test|testing|quality)\b'
    - '\b(devops|sre|site reliability)\b'
    - '\b(data (engineer|scientist|analyst)|analytics)\b'
    - '\b(embedded|firmware|hardware)\b'
    - '\b(salesforce|servicenow|sap|dynamics)\b'
    - '\b(designer|sales|marketing|solutions? engineer|support engineer|customer)\b'
    - '\b(junior|jr\.?|intern|internship|graduate|new grad|entry[\s-]level|apprentice|trainee)\b'
    - '\bassociate (software )?(engineer|developer)\b'
    - '\b(manager|director|head of|vp|vice president)\b'

  stack:
    # keep if Python evidence; else drop if another backend language is named; else keep
    python_patterns: ['\bpython\b', '\bdjango\b', '\bfastapi\b', '\bflask\b']
    other_language_patterns:
      - '\bjava\b(?!script)'
      - '\bgolang\b'
      - '\b(ruby|rails)\b'
      - '\b(php|laravel)\b'
      - '(\.net\b|\bc#)'
      - '\b(scala|kotlin|elixir|rust)\b'
      - 'c\+\+'
      - '\bnode\.?js\b'
    # a title naming another language (and not Python) is dropped even if the
    # description mentions Python somewhere
    title_other_language_patterns:
      - '\bgo(lang)?\b(?!-to)'
      - '\bjava\b(?!script)'
      - '\b(node(\.?js)?|nest\.?js|ruby|rails|php|laravel|scala|kotlin|elixir|rust)\b'
      - '(\.net\b|\bc#|c\+\+)'
      - '\b(rpg|ibm i|as/?400|cobol|abap)\b'
    other_language_skill_tags: [java, go, golang, ruby, php, csharp, dotnet, scala, kotlin, elixir, rust, cpp, nodejs]
    strong: [django, drf, fastapi, celery, postgres, redis, aws, rabbitmq, clickhouse,
             elasticsearch, docker, terraform, opentofu, opentelemetry, llm, rag, bedrock]

  salary:
    min_usd_year: 105000        # drop only when the stated max is below this
    usd_rates: {USD: 1.0, EUR: 1.08, GBP: 1.27, CAD: 0.72, AUD: 0.65}
    period_multipliers: {year: 1, month: 12, week: 52, day: 260, hour: 2080}

  employment_types: [full_time, contract]   # unknown type is kept

  hard_drop_patterns:           # matched against the full description: always dropped
    us_work_authorization:
      - 'authori[sz]ed to work (in|for) (the )?(u\.?s\.?a?|united states)'
      - '(u\.?s\.?|united states) (citizen(ship)?|person)s?\b.{0,40}\b(only|required|requirement)'
      - 'must (be|hold) (a )?(u\.?s\.?|united states) (citizen|green card)'
      - '\bgreen card holders?\b'
      - 'eligible to work in the (u\.?s\.?a?|united states) without'
      - '\b(?:a|be|being)\s+(?:u\.?s\.?|united states)\s+citizen\b'
    security_clearance:
      - '\b(security|secret|ts/sci|top secret|public trust) clearance\b'
      - '\bclearance (is )?required\b'
    ai_gig:                     # task-paid AI-lab coding/evaluation gigs posted as jobs
      - '\btask[\s-]based (?:compensation|pay)\b'
      - '\b(?:with|for) (?:a )?leading ai labs?\b'
      - '\b\d{2,4}\+? openings\b'
    w2_only:
      - '\bw-?2\b.{0,25}\bonly\b'
      - '\bonly\b.{0,25}\bw-?2\b'

  exclude:
    companies: []               # matched against company name and slug, whole words
    company_types: [agency, outsource, outstaff]
    domains: [gambling, crypto]
    title_keywords: ['ai trainer', 'ai training', 'annotation', 'rlhf', 'data labell?ing', 'freelance', 'ai evaluation', 'evaluation expert',
                     'github contributor', '(?:open|general|spontaneous) application', 'talent (?:pool|community|network)', 'future opportunit', 'expression of interest']
    # staffing / talent marketplaces and agency-like company names (matched on the company name)
    company_name_keywords: ['\bjobgether\b', '\bjobs for humanity\b', '\bagency\b', '\bstaffing\b', '\brecruit\w*', '\btalents?\b', '\boutsourc\w*', '\bturing\b', '\bproxify\b', '\btoptal\b', '\bbraintrust\b', '\bandela\b', '\barc\.dev\b', '\blemon\.io\b', '\bupwork\b', '\bwesource\b', '\bcrossover\b']
    summary_keywords: ['\b(defen[cs]e contractor|military|weapons?|munitions)\b', '\b(adult|porn)\b']

  non_english: flag             # keep but tag

rules:
  # Deterministic parsers (scanner/rules.py). Every pattern has a name; decisions are logged
  # with "<group>.<name>" so `scanner learn` can report how often each rule fires and how
  # often the AI spot-check agrees with it. Add new rules here; no code change needed.
  location:
    # A place captured by a lock rule is allowed if it matches candidate_place.
    candidate_place: '\b(bangladesh|south asia|(?<!southeast )(?<!south-east )(?<!east )(?<!central )asia|apac|asia[- ]pacific|anywhere(?!\s+(?:with)?in\s+(?:the\s+)?(?!world\b))|worldwide|world|global(ly)?|any country|all countries|international(ly)?)\b'
    # Places that are not a restriction ("authorized to work in the country where you reside").
    neutral_place: '\b(country (where|in which|of residence)|your (country|location|home)|where you (live|reside|are)|which you reside|the country you)\b'
    # Sentences about a work-from-anywhere *perk* never count as eligibility evidence.
    perk: '\b(?:per year|a year|each year|per annum|weeks? (?:a|per|each)|days (?:a|per|each) year|workation|work from anywhere (?:policy|program|weeks?)|for up to \d+\s+(?:weeks?|months?|days))\b'
    # Legal boilerplate is never location evidence ("no lie detector tests to applicants in any location").
    ignore_sentence: '\b(?:lie detector|polygraph|equal (?:employment )?opportunity|discriminat\w*|pay transparency|privacy (?:notice|policy)|ccpa|gdpr|e-verify|reasonable accommodation|background check)\b'
    # Living in a US/NA/EU time zone is a residence requirement, not working hours:
    # "must reside in the Eastern or Central time zone" is a lock ("must be located in a US time zone" stays timezone).
    residence_rules: [must_reside, open_to, candidate_based]
    residence_zone_lock: '\b(?:reside|residing|resident|live|living)\b[^.;\n]{0,30}\b(?:eastern|central|mountain|pacific|est|cst|mst|pst|edt|cdt|pdt|us|u\.s|north american?|american|european|cet)\b[^.;\n]{0,40}\btime ?zones?\b'
    timezone_place: '\b(time ?zones?|utc|gmt|est|pst|cet|eastern|pacific|central) '
    lock:
      must_reside: '\b(?:must|need to|needs to|required to|should|have to|has to|will need to)\s+(?:currently\s+)?(?:be\s+)?(?:physically\s+)?(?:located|based|residing|reside|live|living|a\s+(?:legal\s+)?resident)\s+(?:in|within|of)\s+(?P<place>[^.;:\n]{2,160})'
      remote_within: '\b(?:remote|work options|working)\b[^.;\n]{0,25}?\b(?:within|in|across|spanning|throughout)\s+(?:the\s+)?(?P<place>(?:continental\s+)?(?:u\.?s\.?a?|united states|canada|uk|united kingdom|eu|europe|european union|eea|germany|france|spain|portugal|poland|netherlands|ireland|india|brazil|mexico|argentina|colombia|latam|latin america|australia|new zealand|philippines|ukraine|israel|south africa|nigeria|kenya|pakistan|egypt|turkey|romania)\b[^.;\n]{0,40})'
      place_only: '\b(?P<place>u\.?s\.?a?|united states|canada|uk|eu|europe|latam|emea|north america)[\s-]+(?:only|based only|residents only)\b'
      open_to: '\b(?:open|available)\s+(?:only\s+)?to\s+(?:candidates|applicants|residents|people|individuals|those|anyone)\s+(?:who\s+(?:are|live|reside)\s+)?(?:based|located|residing|living)?\s*(?:in|within|from)\s+(?P<place>[^.;:\n]{2,160})'
      only_hiring: '\b(?:only|currently|exclusively)\s+(?:hiring|accepting|considering|recruiting|able to hire|able to employ)\s+(?:applications\s+|candidates\s+|applicants\s+|talent\s+|people\s+)?(?:from|in|based in|located in|who (?:live|reside) in)\s+(?P<place>[^.;:\n]{2,80})'
      can_only_hire: '\b(?:can|are able to|is able to)\s+only\s+(?:hire|employ|consider|accept|support)\s+(?:candidates\s+|people\s+|applicants\s+|employees\s+|team members\s+)?(?:who\s+(?:live|reside)\s+)?(?:in|from|based in|located in)\s+(?P<place>[^.;:\n]{2,80})'
      right_to_work: '\b(?:right|authori[sz]ation|authori[sz]ed|eligible|eligibility|permit(?:ted)?|legally able)\s+to\s+work\s+(?:in|for|within)\s+(?:the\s+)?(?P<place>[^.;:\n,]{2,40})'
      russia: '(?P<place>на территории (?:рф|россии)|по тк рф|гражданств\w* рф|только (?:из|в) (?:рф|россии)|резидент\w* рф|город\w* рф|западнее урала)'
      ukraine: '(?P<place>перебування в україні|в межах україни|tax residen\w+ in ukraine|резидент\w* україни)'
      hiring_in: '\b(?:hiring|recruiting)\s+(?:for\s+this\s+(?:role|position)\s+)?(?:in|from|across)\s+(?:the\s+)?(?P<place>(?:u\.?s\.?a?|united states|canada|uk|united kingdom|eu|europe|european union|eea|germany|deutschland|france|spain|portugal|poland|netherlands|ireland|india|brazil|mexico|argentina|colombia|latam|latin america|australia|new zealand|philippines|ukraine|israel|south africa|nigeria|kenya|pakistan|egypt|turkey|romania|singapore|north america)\b[^.;:\n]{0,80})'
      remote_from: '\b(?:work(?:ing)?\s+)?remote(?:ly)?\s+from\s+(?:the\s+)?(?P<place>[^.;:\n]{2,120})'
      anywhere_within: '\banywhere\s+(?:with)?in\s+(?:the\s+)?(?P<place>[^.;:\n]{2,80})'
      candidate_based: '(?:^\W*|\b(?:candidates?|you|applicants?|someone|ideally|currently|engineer|developer|role|position|job)\b[^.;\n]{0,40}?\b)(?:based|located|residing)\s+in\s+(?:the\s+)?(?P<place>(?:u\.?s\.?a?|united states|canada|uk|united kingdom|eu|europe|european union|eea|germany|deutschland|france|spain|portugal|poland|netherlands|ireland|india|brazil|mexico|argentina|colombia|latam|latin america|australia|new zealand|philippines|ukraine|israel|south africa|nigeria|kenya|pakistan|egypt|turkey|romania|singapore|north america)\b[^.;:\n]{0,80})'
      following_places: '\b(?:work|working|reside|located|live|hire|hiring|remote)\b[^.;\n]{0,40}?(?P<place>(?:in\s+)?(?:one of\s+)?(?:the\s+)?following\s+(?:states|countries|locations|regions|cities)[^.\n]{0,200})'
      entity_countries: '(?P<place>\b(?:one of our\s+|countries where we have (?:a |an )?(?:legal )?|locations where we have (?:a |an )?)entit(?:y|ies)\b[^.\n]{0,200})'
    positive:
      anywhere_world: '\banywhere\s+in\s+the\s+world\b'
      worldwide: '\b(?:remote|hire|hiring|recruit\w*|position|role|job|open|candidates|applicants|location)\b[^.;\n]{0,25}\b(?:worldwide|world-wide|globally(?!\s+distributed)|from any country|in any country(?!\s+where)|any location|any time ?zone)\b'
      remote_global_label: '\bremote\s*[(\-–:/|]\s*(?:worldwide|global|anywhere)\b'
      candidate_country: '\bbangladesh\b'
    # Restrictive-sounding but not conclusive (often just a label): sent to the AI.
    weak_lock:
      location_line: '^\W*(?:preferred\s+)?(?:candidate\s+)?(?:job\s+)?locations?(?:\(s\))?\s*[:\-–]\s*(?P<place>[^\n]{2,80})$'
      remote_paren: '\bremote\s*[(\[]\s*(?P<place>[^)\]\n]{2,60})[)\]]'
      pin_line: '^\W*📍\s*(?P<place>[^\n]{2,80})$'
    # Positive but not conclusive: sent to the AI.
    weak_positive:
      # a bare "work from anywhere" is often a perk-list line for a single-country company
      anywhere: '\b(?:work|working|live|living|based|remote(?:ly)?|hire|hiring|located)\b[^.;\n]{0,30}\banywhere\b(?!\s+(?:in|within|across|inside)\s+(?:the\s+)?\w)'
      entity_any_country: '\bany country where (?:we|the company) (?:have|has)\b'
      eor: '\b(?:via|through|using|with|on)\s+(?:deel|remote\.com|oyster|rippling|papaya global|velocity global|multiplier|globalization partners)\b'
      distributed: '\b(?:fully|globally|truly)\s+distributed\b'
      many_countries: '\b(?:in|across|from)\s+\d{2,3}\+?\s+countries\b'
    timezone:
      overlap: '\b(?:overlap|time ?zones?|working hours|business hours|core hours|hours of)\b[^.;\n]{0,60}\b(?:est|edt|pst|pdt|cst|cet|cest|gmt|utc|et|pt|ct|eastern|pacific|central|us hours|european hours)\b'
      overlap_rev: '\b(?:est|edt|pst|pdt|cet|gmt|utc|eastern|pacific)\b[^.;\n]{0,40}\b(?:overlap|working hours|business hours|time ?zone)\b'
    # A sentence is "location wording" (ambiguous if no rule above decides it) when it has a cue AND a geography term.
    cue: '\b(reside|residing|resident|located|based in|based out of|live in|living in|hire|hiring|employ|eligib\w*|open to|countries|work from|time ?zones?|relocat\w*)\b'
    geo: '\b(u\.?s\.?a?|united states|america[s]?|canada|uk|united kingdom|eu|eea|emea|europe(an)?|latam|latin america|south america|apac|asia|africa|middle east|mena|india|pakistan|bangladesh|philippines|vietnam|indonesia|singapore|australia|new zealand|brazil|mexico|argentina|colombia|chile|peru|germany|france|spain|portugal|poland|netherlands|ireland|italy|sweden|norway|denmark|finland|switzerland|austria|belgium|czech\w*|romania|bulgaria|ukraine|serbia|croatia|greece|turkey|israel|egypt|nigeria|kenya|south africa|japan|korea|china|taiwan|hong kong|malaysia|thailand|uae|dubai|saudi|qatar|deutschland|україн\w*|рф|росси\w*|following (?:states|countries|locations|regions|cities)|entit(?:y|ies))\b'
    max_snippet_chars: 1500
  ghost:
    # Ghost postings: reposted, mass-posted, evergreen or re-posted by a third party (scanner/ghost.py).
    # Signals add up: score >= drop_at is dropped; >= flag_at is kept, flagged, and can't be in Apply.
    drop_at: 3
    flag_at: 2
    weights: {freehire_evergreen: 3, fake_freshness: 3, reposted: 2, mass_posted: 1, evergreen_text: 2,
              scraped_repost: 2, aggregator_source: 1, thin_description: 1}
    repost_gap_days: 7          # a copy first seen this much earlier counts as a repost, not a concurrent copy
    repost_min: 2               # reposts of one role (company + title) before it counts
    mass_min: 5                 # concurrent copies of one role (often one req in several countries: weak alone)
    min_description_chars: 400
    # sources that re-post or rewrite other sites' postings (the part of the freehire id before ':')
    aggregator_sources: 'whatjobs(?:-\w+)?|adzuna|jobleads|torre|startupjobs|energyjobline|telegram|jobstash|arbeitnow'
    evergreen_text:
      - '\b(?:this|the) (?:is an? )?(?:evergreen|pipeline) (?:role|position|requisition|posting|opening|req)\b'
      - '\bevergreen (?:role|position|requisition|posting|opening|req)\b'
      - '\b(?:no|not an?) (?:current|immediate|active) (?:opening|vacanc\w+|position)\b'
      - '\b(?:this|the) (?:posting|position|role|listing|requisition|vacancy) (?:is )?(?:for|to build|intended to build) (?:our |a )?(?:talent|candidate) (?:pool|pipeline|community|network)'
      - '\bcontingent (?:up)?on (?:a |the )?(?:contract|funding) award\b'
    scraped_repost_text:
      - 'Real-time AI thinking|\bMatch and rank\b|How you fit the job|Meet your team Comments'
      - '\boriginally posted (?:on|at)\b'
  role:
    agency:
      for_our_client: '\b(?:for|on behalf of)\s+(?:our|a|one of our)\s+(?:client|customer|partner)s?\b'
      our_client_is: '\bour client(?:\s+is|,)'
      our_partner_is: '\bour (?:partner|client) is (?:looking|seeking|hiring|searching)\b'
      staffing: '\b(?:staff augmentation|outstaff\w*|outsourc\w+ (?:company|agency|partner)|body ?shop|nearshore|near-shore|recruit(?:ing|ment) (?:agency|firm|partner)|staffing (?:agency|firm|company)|talent (?:agency|marketplace))\b'
      dev_shop: '\bwe are a (?:software |web |digital )?(?:development|outsourcing|consulting|staffing) (?:company|agency|firm|studio|shop)\b'
    english_mentioned: '\b(english|англи\w+|inglés|anglais|englisch|inglês|angielski)\b'
    frontend_terms: '\b(react|vue|angular|svelte|next\.?js|css|html|tailwind|figma|ui|ux|frontend|front-end|redux|storybook|responsive|accessibility|design system)\b'
    backend_terms: '\b(python|django|fastapi|flask|api|apis|database|postgres\w*|mysql|sql|backend|back-end|server|microservices?|aws|kafka|redis|celery|distributed|scalab\w+)\b'
    frontend_heavy_ratio: 2.0
    fit:
      core: ['\bpython\b', '\bdjango\b', '\bfastapi\b']
      strong: ['\bdjango\b', '\bdjango rest\b|\bdrf\b', '\bfastapi\b', '\bcelery\b', '\bpostgres\w*\b', '\bredis\b', '\baws\b', '\brabbitmq\b', '\bclickhouse\b', '\belasticsearch\b', '\bdocker\b', '\bterraform\b|\bopentofu\b', '\bkubernetes\b', '\bopentelemetry\b|\bgrafana\b', '\bllm\b|\brag\b|\bbedrock\b|\blangchain\b', '\bmicroservices?\b', '\bkafka\b', '\breact\b', '\btypescript\b']
    min_fit_for_apply: 3

liveness:
  # right before the report, ask the employer's ATS (Greenhouse, Lever, Ashby, Workable, SmartRecruiters;
  # else the posting page) whether each job is still open. Only a clear 404/410 or a missing Ashby id drops it.
  enabled: true
  workers: 8

dedup:
  # a job is new only if none of these were reported before:
  # source+external id, normalized URL, company+normalized-title fingerprint
  collapse_window_days: 60      # remember reported seniority per company+family this long
  seniority_rank: {principal: 4, staff: 4, lead: 4, senior: 3, middle: 2, unknown: 2}

llm:
  # Used only when the location rules are stuck (ambiguous wording), plus a few
  # spot-checks of rule decisions per run to measure rule accuracy over time.
  # The model sees the title, tags and the location sentences, not the full posting.
  prompt: prompts/eligibility.example.md
  batch_size: 20                   # postings per request
  workers: 3                       # parallel requests
  call_cap: 40                     # max requests per run; unscreened ambiguous jobs go to Check
  audit_per_run: 10                # rule decisions spot-checked by the AI each run
  # Tried in order; when a model's quota is exhausted the next one takes over.
  # flash-lite was tried and dropped: too loose on location evidence.
  # Any OpenAI-compatible endpoint works (key read from a file), e.g. OrcaRouter's
  # free models; DeepSeek V4 Flash agreed with Claude on 87% of location calls.
  # OpenCode Zen's free models only work inside the OpenCode app.
  # Gemini free tier allows only ~20 requests/day per model. Enable billing on the
  # key for more, or rely on the Claude Code CLI fallback (uses the Claude subscription).
  chain:
    - {provider: openai-compatible, name: orca, base_url: "https://api.orcarouter.ai/v1",
       model: deepseek/deepseek-v4-flash-free, api_key_file: ~/.config/job-hunt/orca.key}
    - {provider: gemini, model: gemini-flash-latest}
    - {provider: gemini, model: gemini-3.5-flash}
    - {provider: claude-cli, model: sonnet}

output:
  jobs_dir: private/jobs
  state_dir: private/state
